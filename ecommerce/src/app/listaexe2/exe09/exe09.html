<h1>Exe 09</h1>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Quantidade</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let produto of produtos; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ produto.nome }}</td>
      <td>{{ produto.preco | currency:'BRL':'symbol':'1.2-2' }}</td>
      <td>{{ produto.quantidade }}</td>
      <td>
        <span class="badge" 
              [ngClass]="{
                'vermelho': produto.quantidade === 0,
                'amarelo': produto.quantidade >= 1 && produto.quantidade <= 5,
                'verde': produto.quantidade > 5
              }">
          {{ getStatusEstoque(produto.quantidade) }}
        </span>
      </td>
    </tr>
  </tbody>
</table>
