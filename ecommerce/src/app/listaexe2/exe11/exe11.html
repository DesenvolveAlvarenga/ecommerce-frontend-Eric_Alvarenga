<div class="filtro-box">
  <label>
    <input type="checkbox" (change)="somenteDisponiveis = !somenteDisponiveis">
    Exibir somente produtos com estoque disponível
  </label>
</div>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Quantidade</th>
    </tr>
  </thead>
  <tbody>
  
    <ng-container *ngFor="let produto of produtos; let i = index">
      <tr *ngIf="!somenteDisponiveis || produto.quantidade > 0">
        <td>{{ i + 1 }}</td>
        <td>{{ produto.nome }}</td>
        <td>{{ produto.preco | currency:'BRL':'symbol':'1.2-2' }}</td>
        <td>{{ produto.quantidade }}</td>
      </tr>
    </ng-container>
  </tbody>
</table>
