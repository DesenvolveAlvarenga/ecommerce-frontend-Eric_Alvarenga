<h1>Exe 08</h1>

<table class="tabela-produtos">
  <thead>
    <tr>
      <th>Posição</th>
      <th>Nome</th>
      <th>Preço Unitário</th>
      <th>Quantidade</th>
      <th>Total em Estoque</th>
    </tr>
  </thead>
  <tbody>
 
    <tr *ngFor="let produto of produtos; let i = index">
      <td>{{ i + 1 }}</td>
      
    
      <td>{{ produto.nome }}</td>
  
      <td>{{ produto.preco | currency:'BRL':'symbol':'1.2-2' }}</td>
      
      <td>{{ produto.quantidade }}</td>
      
  
      <td>{{ produto.preco * produto.quantidade | currency:'BRL':'symbol':'1.2-2' }}</td>
    </tr>
  </tbody>
</table>
